<!doctype html>
<html lang="es" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Guía 100 % · Kingdom Hearts HD 1.5+2.5 ReMIX</title>
  <meta name="description" content="Guía para completar al 100 % los juegos de Kingdom Hearts HD 1.5+2.5 ReMIX con logros de Steam, en castellano.">
  <meta name="color-scheme" content="dark light">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Sora:wght@400;600;800&display=swap">
  <link rel="stylesheet" href="src/styles.css">
  <script>
    // Aplica el tema guardado antes de pintar para evitar parpadeos.
    try {
      const t = JSON.parse(localStorage.getItem('kh100:v1') || '{}').ajustes?.tema;
      if (t) document.documentElement.dataset.theme = t;
    } catch {}
  </script>
</head>

  <div class="sky" aria-hidden="true"></div>

</body>
</html>
